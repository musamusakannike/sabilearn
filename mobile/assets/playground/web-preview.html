<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe id="frame" title="Preview" sandbox="allow-scripts allow-modals"></iframe>
<script>
(function () {
  var frame = document.getElementById('frame');

  function apply(html, css, js) {
    var doc = '<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><style>' +
      (css || '') + '</style></head><body>' + (html || '') + '<script>' + (js || '') + '<' + '/script></body></html>';
    frame.srcdoc = doc;
  }

  function handleIncoming(event) {
    var data = event.data;
    if (typeof data === 'string') {
      try { data = JSON.parse(data); } catch (e) { return; }
    }
    if (!data || typeof data !== 'object') return;
    if (data.type === 'preview') apply(data.html, data.css, data.js);
  }

  window.addEventListener('message', handleIncoming);
  document.addEventListener('message', handleIncoming);
})();
</script>
</body>
</html>
